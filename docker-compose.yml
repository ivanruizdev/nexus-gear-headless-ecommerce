# docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: ./aimeos-headless
      dockerfile: Dockerfile
    image: nexus-gear-backend:latest
    container_name: nexus_gear_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./aimeos-headless:/var/www/html
    networks:
      - nexus_network

  nginx:
    image: nginx:alpine
    container_name: nexus_gear_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./aimeos-headless:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - nexus_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nexus-gear-frontend:latest
    container_name: nexus_gear_frontend
    restart: unless-stopped
    ports:
      - "5173:5173" 
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    networks:
      - nexus_network

  db:
    image: postgres:15-alpine
    container_name: nexus_gear_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_gear_db
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: secure_postgres_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - nexus_network

networks:
  nexus_network:
    driver: bridge

volumes:
  db_data:
